name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check publication boundaries
        run: node scripts/check-publication.mjs
      - run: npm ci
      - name: Set up isolated local configuration
        run: cp wrangler.example.jsonc wrangler.jsonc
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:services
      - run: npm run build
      - run: node scripts/test-built-cron.mjs
